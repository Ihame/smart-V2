<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGarage - AI-Powered EV & Hybrid Care</title>
    <meta name="description" content="AI-powered care for your electric and hybrid vehicles across Africa. Virtual diagnosis, battery prediction, and expert mechanic services.">
    
    <!-- Permissions -->
    <meta name="permissions" content="camera, microphone, geolocation">
    
    <!-- Theme -->
    <meta name="theme-color" content="#2563eb">
    <meta name="color-scheme" content="dark light">
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        #root {
            min-height: 100vh;
        }
        
        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1f2937; color: white;">
            <div style="text-align: center;">
                <div class="loading-spinner" style="margin-bottom: 16px;"></div>
                <p>Loading SmartGarage...</p>
            </div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
